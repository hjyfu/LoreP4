name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup component add rustfmt clippy
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked
      - run: cargo build --locked --release
      - name: Test migration against Lore and P4
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/migration-tools"
          mkdir -p "$bin"
          for program in p4 p4d; do
            curl -fsSL --retry 3 "https://filehost.perforce.com/perforce/r24.2/bin.linux26x86_64/$program" -o "$bin/$program"
            chmod +x "$bin/$program"
          done
          curl -fsSL --retry 3 https://github.com/EpicGames/lore/releases/download/v0.14.0/lore-v0.14.0-x86_64-unknown-linux-gnu.tar.gz -o "$bin/lore.tar.gz"
          tar -xzf "$bin/lore.tar.gz" -C "$bin"
          lore_bin=$(find "$bin" -type f -name lore -print -quit)
          PATH="$(dirname "$lore_bin"):$bin:$PATH" python3 tests/roundtrip.py --cli target/release/lorep4 --p4d "$bin/p4d"
      - uses: actions/upload-artifact@v4
        with:
          name: lorep4-${{ runner.os }}-x86_64
          path: |
            target/release/lorep4
            target/release/lorep4.exe
          if-no-files-found: error
